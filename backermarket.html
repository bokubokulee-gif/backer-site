<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="backer-public-view-counts" content="true" />
<meta name="backer-hide-unavailable-analytics-ui" content="true" />
<meta name="theme-color" content="#070809" />
<title>Backer Market</title>
<meta name="description" content="View traded market odds, outcomes, rules, and your simulated position on Backer." />
<link rel="icon" type="image/png" href="img/backer-mark.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css?v=6" />
<link rel="stylesheet" href="css/market.css?v=4" />
<link rel="stylesheet" href="css/poa-terminal.css?v=13" />
<link rel="stylesheet" href="css/market-community.css?v=1" />
<link rel="stylesheet" href="css/market-detail-page.css?v=7" />
<link rel="stylesheet" href="css/analytics.css?v=2" />
</head>
<body class="mdp-page">
  <header class="mdp-nav" aria-label="Backer market navigation">
    <a class="mdp-brand" href="backerdemo.html" aria-label="Backer home">
      <span class="mdp-brand-mark" aria-hidden="true"><img src="img/backer-mark.png?v=2" alt="" /></span>
      <span>Backer</span>
    </a>
    <nav class="mdp-nav-links" aria-label="Market sections">
      <a class="is-active" href="backerdemo.html#market" aria-current="page">Markets</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="backerdemo.html#proof">Proof of Attention</a>
    </nav>
    <a class="mdp-back" href="backerdemo.html#market">
      <span aria-hidden="true">←</span>
      <span>Back to markets</span>
    </a>
  </header>

  <main class="mdp-status" id="marketPageStatus" aria-live="polite" aria-busy="true">
    <section class="mdp-status-card" id="marketPageMessage" aria-labelledby="marketPageTitle">
      <span class="mdp-kicker">Backer exchange</span>
      <div class="mdp-loader" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1 id="marketPageTitle">Opening market…</h1>
      <p id="marketPageCopy">Loading the traded-odds history, outcomes, order ticket, rules, and your simulated fills.</p>
      <div class="mdp-error-actions" id="marketPageActions" hidden>
        <a class="mdp-primary-action" href="backerdemo.html#market">Browse markets</a>
      </div>
      <div class="mdp-market-suggestions" id="marketPageSuggestions"></div>
    </section>
    <noscript>
      <section class="mdp-status-card mdp-noscript">
        <span class="mdp-kicker">JavaScript required</span>
        <h1>This market needs JavaScript to run.</h1>
        <p>Enable JavaScript to view the interactive chart and simulated order ticket.</p>
        <a class="mdp-primary-action" href="backerdemo.html#market">Back to markets</a>
      </section>
    </noscript>
  </main>

<script src="js/analytics-core.js?v=1"></script>
<script src="js/analytics.js?v=2"></script>
<script src="js/data.js"></script>
<script src="js/market-data.js?v=3"></script>
