<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08080a" />
  <meta name="color-scheme" content="dark" />
  <meta name="backer-hide-unavailable-analytics-ui" content="true" />
  <meta name="description" content="Join the Backer waitlist for early access to a financial market that prices human attention." />
  <meta name="robots" content="index,follow" />
  <!-- Production hook: add <meta name="backer-waitlist-endpoint" content="https://…"> when a waitlist API is ready. -->
  <title>Join the Backer waitlist</title>
  <link rel="icon" type="image/png" href="img/backer-mark.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/waitlist.css?v=2" />
  <link rel="stylesheet" href="css/analytics.css?v=20260820-3" />
<link rel="stylesheet" href="css/backer-dock.css?v=20260821-2" />
</head>
<body class="waitlist-page">
  <a class="skip-link" href="#waitlist-email">Skip to the waitlist form</a>

  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="waitlist-atmosphere" aria-hidden="true"></div>
  <div class="waitlist-vignette" aria-hidden="true"></div>
  <div class="waitlist-grain" aria-hidden="true"></div>

  <header class="waitlist-top" aria-label="Backer beta status">
    <span class="beta-pill"><span class="beta-dot" aria-hidden="true"></span>Beta</span>
  </header>

  <main class="waitlist-shell">
    <section class="waitlist-card" aria-labelledby="waitlist-title">
      <div class="waitlist-brand" aria-label="Backer">
        <span class="brand-mark" aria-hidden="true">
          <img src="img/backer-mark.png?v=2" alt="" width="52" height="52" />
        </span>
        <span class="brand-name">Backer</span>
      </div>

      <div class="waitlist-intro">
        <h1 id="waitlist-title">Join the waitlist</h1>
        <p class="waitlist-subtitle">Get early access to Backer</p>
        <p class="waitlist-description">A financial market where your attention can be rightfully valued.</p>
      </div>

      <p class="market-statement">
        <span>Prediction market prices events.</span>
        <strong>Backer prices human attention.</strong>
      </p>

      <form class="waitlist-form" id="waitlistForm" novalidate>
        <label for="waitlist-email">Email address</label>
        <div class="email-row">
          <input
            id="waitlist-email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            maxlength="254"
            placeholder="you@example.com"
            aria-describedby="waitlist-status"
            required
          />
          <button type="submit">Get Notified</button>
        </div>
        <p class="form-status" id="waitlist-status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>
      </form>

      <div class="waitlist-meta">
        <div class="joined-proof">
          <span class="proof-dots" aria-hidden="true">
            <span>B</span><span>A</span><span>+</span>
          </span>
          <span>~2K people already joined</span>
        </div>
        <span class="meta-divider" aria-hidden="true"></span>
        <p class="arrival"><span class="arrival-dot" aria-hidden="true"></span>Coming soon</p>
      </div>
    </section>
  </main>

  <noscript>
    <p class="noscript-note">JavaScript is required to save your waitlist email.</p>
  </noscript>

  <script src="js/waitlist.js?v=2" defer></script>
  <script src="js/shader.js?v=1" defer></script>
  <script src="js/analytics-core.js?v=20260820-3" defer></script>
  <script src="js/analytics.js?v=20260820-3" defer></script>
<div data-backer-dock></div>
<script src="js/backer-dock.js?v=20260821-2"></script>
</body>
</html>
